    <div id="welcome-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 text-white p-6 text-center">

                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">Connected</span>
                </div>
            </div>
        </div>
        <div class="flex flex-col gap-1 items-end">
            <select id="level-select" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs outline-none focus:ring-1 focus:ring-blue-400">
                <option value="1">Lv 1: คุณเปรมวดี (หญิง-ใจดี)</option>
                <option value="2">Lv 2: คุณสมเกียรติ (ชาย-เป๊ะ)</option>
                <option value="3">Lv 3: คุณฤทัย (หญิง-เหวี่ยง)</option>
                <option value="4">Lv 4: คุณฐิติกร (ชาย-บิ๊กบอส)</option>
            </select>
            <button id="end-call-btn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-1 rounded-md text-[10px] font-bold uppercase transition-colors">วางสาย/ประเมินผล</button>

    <main id="chat-window" class="chat-area overflow-y-auto p-6 flex flex-col gap-4">

    <footer class="p-8 bg-white border-t flex flex-col items-center justify-center gap-4">

            <div class="p-8 space-y-6">

                            <p class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Points</p>
                        </div>
                    </div>
                </div>
                <div id="eval-details" class="space-y-4 text-sm"></div>
            </div>
            <div class="p-6 flex justify-center bg-slate-50 border-t">

            </div>
        </div>

<head>
    <meta charset="UTF-8">

    <title>AI Telesales Simulator - Exam Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
        .mic-active { animation: pulse 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .chat-area { height: calc(100vh - 240px); }

<body class="flex flex-col h-screen overflow-hidden">

    <div id="welcome-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 text-white p-6 text-center">
        <div>
            <h1 class="text-4xl font-bold mb-4 text-blue-400 uppercase tracking-wider">Exam Simulator</h1>
            <p class="mb-10 text-slate-400">ระบบฝึกฝนและประเมินผลตามเกณฑ์มาตรฐาน 17 ข้อ</p>
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-14 py-5 rounded-full text-2xl font-bold shadow-2xl transition-all active:scale-95">
                เริ่มบททดสอบ
            </button>
        </div>
    </div>

    <header class="p-4 bg-white border-b flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div id="avatar" class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white text-xl font-bold shadow-inner">P</div>
            <div>
                <h2 id="display-name" class="font-bold text-slate-800 text-lg leading-tight">คุณเปรมวดี</h2>
                <span class="text-[10px] text-green-500 font-bold uppercase tracking-widest">Live Session</span>
            </div>
        </div>
        <div class="flex flex-col gap-1 items-end">
            <select id="level-select" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs outline-none">
                <option value="1">Lv 1: คุณเปรมวดี (ใจดี)</option>
                <option value="2">Lv 2: คุณสมเกียรติ (เน้นเหตุผล)</option>
                <option value="3">Lv 3: คุณฤทัย (ใจร้อน)</option>

            </select>
            <button id="end-call-btn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-1 rounded-md text-[10px] font-bold uppercase transition-all shadow-md">จบการสนทนา & ประเมินผล</button>
        </div>
    </header>

    <main id="chat-window" class="chat-area overflow-y-auto p-6 flex flex-col gap-4">
    </main>

                    </div>
                </div>
                <div id="eval-details" class="space-y-4 text-sm"></div>
            </div>
            <div class="p-6 flex justify-center bg-slate-50 border-t">
                <button onclick="location.reload()" class="bg-slate-900 text-white px-12 py-3 rounded-full font-bold shadow-lg">ฝึกใหม่อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const micBtn = document.getElementById('mic-btn');
        const instruction = document.getElementById('instruction');
        const userTranscript = document.getElementById('user-transcript');
        const levelSelect = document.getElementById('level-select');
        const displayName = document.getElementById('display-name');
        const avatar = document.getElementById('avatar');
        const endCallBtn = document.getElementById('end-call-btn');

        let history = [];
        let recognition;

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.interimResults = true;
            recognition.onstart = () => { micBtn.classList.add('mic-active'); instruction.innerText = "กำลังฟัง..."; };
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                userTranscript.innerText = `พูดว่า: ${text}`;
                if (event.results[0].isFinal) sendToAI(text);
            };
            recognition.onend = () => { micBtn.classList.remove('mic-active'); instruction.innerText = "แตะไมค์เพื่อพูดต่อ"; };
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('welcome-screen').classList.add('hidden');
            new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==').play();
            appendMessage('bot', 'ฮัลโหลค่ะ... สวัสดีค่ะ โทรจากไหนคะ?');
        });

        micBtn.addEventListener('click', () => { if(recognition) recognition.start(); });

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `max-w-[85%] p-4 rounded-2xl text-sm ${role === 'user' ? 'bg-blue-600 text-white self-end rounded-tr-none' : 'bg-white text-slate-800 self-start border border-slate-100 rounded-tl-none shadow-sm'}`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
        }

        async function sendToAI(message) {
            appendMessage('user', message);
            userTranscript.innerText = "";
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, history, level: levelSelect.value })
                });
                const data = await res.json();
                appendMessage('bot', data.text);
                history.push({ role: "user", parts: [{ text: message }] });
                history.push({ role: "model", parts: [{ text: data.text }] });
                if (data.audio) {
                    const audio = new Audio(`data:audio/mp3;base64,${data.audio}`);
                    audio.play();
                }
            } catch (e) { console.error(e); }
        }

        endCallBtn.addEventListener('click', async () => {
            if (history.length === 0) return alert("ยังไม่ได้เริ่มคุยเลยค่ะ");
            endCallBtn.innerText = "ประเมินผล...";
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history, isEnding: true })
                });
                const data = await res.json();
                const score = data.evaluation.score;
                const passed = score >= 50;
                
                document.getElementById('eval-modal').classList.remove('hidden');
                document.getElementById('result-header').className = `p-8 text-center text-white ${passed ? 'bg-green-600' : 'bg-red-600'}`;
                document.getElementById('result-status').innerText = passed ? 'สอบผ่าน (PASS)' : 'ไม่ผ่าน (FAIL)';
                document.getElementById('result-status').className = `text-sm font-bold mt-2 py-1 px-4 inline-block rounded-full ${passed ? 'bg-green-700' : 'bg-red-700'}`;
                document.getElementById('score-val').innerText = score;
                document.getElementById('score-val').className = `text-4xl font-black ${passed ? 'text-green-600' : 'text-red-600'}`;

                document.getElementById('eval-details').innerHTML = `
                    <div class="space-y-4">
                        <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200">
                            <p class="font-bold text-slate-800 mb-2 underline">การให้คะแนน 17 หัวข้อ (PDF)</p>
                            <div class="grid grid-cols-1 gap-1 text-[11px] leading-tight">
                                ${data.evaluation.detail_breakdown.map(item => `
                                    <div class="flex justify-between border-b border-slate-100 py-1">
                                        <span>${item.topic}</span>
                                        <span class="font-bold text-blue-600">${item.stars} ⭐</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="p-4 bg-green-50 rounded-2xl border border-green-100">
                            <p class="font-bold text-green-700 mb-1">✅ จุดแข็ง</p>
                            <p class="text-slate-600 text-[12px]">${data.evaluation.strengths}</p>
                        </div>
                        <div class="p-4 bg-red-50 rounded-2xl border border-red-100">
                            <p class="font-bold text-red-700 mb-1">🧨 จุดที่ต้องพัฒนา</p>
                            <p class="text-slate-600 text-[12px]">${data.evaluation.weaknesses}</p>
                        </div>
                    </div>
                `;
            } catch (e) { alert("เกิดข้อผิดพลาดในการวิเคราะห์"); }
        });
    </script>
</body>
