<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Telesales Simulator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f0f2f5; }
        .chat-container { height: calc(100vh - 180px); }
        .glass-morphism { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div id="welcome-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 bg-opacity-95 text-white p-6">
        <div class="text-center">
            <h1 class="text-3xl font-bold mb-4 text-blue-400">Telesales Simulator</h1>
            <p class="mb-8 text-slate-300">ยินดีต้อนรับสู่บททดสอบการขายประกันแบบเสมือนจริง</p>
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-4 rounded-full text-xl font-medium transition-all transform hover:scale-105 active:scale-95 shadow-lg">
                เข้าสู่การฝึกอบรม
            </button>
            <p class="mt-4 text-xs text-slate-500">* กรุณาเปิดเสียงลำโพงเพื่อรับชมบทบาทสมมติ *</p>
        </div>
    </div>

    <header class="glass-morphism sticky top-0 z-10 p-4 border-b border-slate-200 shadow-sm flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold">P</div>
            <div>
                <h2 class="font-medium text-slate-800">คุณเปรมวดี</h2>
                <p class="text-xs text-green-500 flex items-center gap-1">● กำลังออนไลน์</p>
            </div>
        </div>
        <select id="level-select" class="bg-slate-100 text-sm border-none rounded-lg px-3 py-2 outline-none">
            <option value="1">ด่าน 1: ลูกค้าใจดี</option>
            <option value="2">ด่าน 2: ลูกค้าช่างเลือก</option>
            <option value="3">ด่าน 3: ลูกค้าสายแข็ง</option>
        </select>
    </header>

    <main id="chat-window" class="chat-container overflow-y-auto p-4 flex flex-col gap-4">
        </main>

    <footer class="p-4 bg-white border-t border-slate-200">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="พิมพ์ข้อความของคุณที่นี่..." 
                class="flex-1 bg-slate-100 rounded-2xl px-5 py-3 outline-none focus:ring-2 focus:ring-blue-400 transition-all">
            <button type="submit" id="send-btn" class="bg-blue-600 p-3 rounded-full text-white hover:bg-blue-500 transition-all disabled:bg-slate-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </form>
    </footer>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const levelSelect = document.getElementById('level-select');
        const welcomeScreen = document.getElementById('welcome-screen');
        const startBtn = document.getElementById('start-btn');

        let history = [];

        // 🔊 ระบบแก้ปัญหา iPhone: ปลดล็อก AudioContext
        let audioContext;
        startBtn.addEventListener('click', () => {
            welcomeScreen.classList.add('hidden');
            // สร้างเสียงเงียบๆ เพื่อเบิกทางให้ iPhone ยอมรับเสียง
            const silentAudio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==');
            silentAudio.play().catch(e => console.log("Audio Init error", e));
            
            appendMessage('bot', 'สวัสดีค่ะ มีธุระอะไรหรือเปล่าคะ? (กรุณาแนะนำตัวตามกฎ คปภ.)');
        });

        const appendMessage = (role, text) => {
            const div = document.createElement('div');
            div.className = `max-w-[80%] p-4 rounded-2xl ${role === 'user' ? 'bg-blue-600 text-white self-end rounded-tr-none' : 'bg-white text-slate-800 self-start shadow-sm border border-slate-100 rounded-tl-none'}`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
        };

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message, 
                        history, 
                        gender: 'female',
                        level: parseInt(levelSelect.value)
                    })
                });

                const data = await res.json();
                appendMessage('bot', data.text);
                history.push({ role: 'user', parts: [{ text: message }] });
                history.push({ role: 'model', parts: [{ text: data.text }] });

                // 🔊 เล่นเสียง (วิธีนี้รองรับ iOS หลังจากการคลิกปุ่ม Start)
                if (data.audio) {
                    const audio = new Audio(`data:audio/mp3;base64,${data.audio}`);
                    audio.play();
                }
            } catch (error) {
                console.error("Error:", error);
                appendMessage('bot', 'ขออภัยค่ะ ระบบขัดข้องนิดหน่อย');
            }
        });
    </script>
</body>
</html>
