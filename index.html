<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Telesales Simulator PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .mic-active { animation: pulse 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .chat-area { height: calc(100vh - 280px); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <div id="welcome-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 text-white p-6 text-center">
        <div class="max-w-sm">
            <h1 class="text-4xl font-bold mb-4 text-blue-400 uppercase tracking-widest">Exam Mode</h1>
            <p class="mb-10 text-slate-400">ระบบฝึกฝนการขายและประเมินผล 17 ข้อ</p>
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-500 text-white w-full py-5 rounded-full text-2xl font-bold transition-all active:scale-95">เริ่มบททดสอบ</button>
        </div>
    </div>

    <header class="p-4 bg-white border-b flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <div id="avatar" class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold transition-colors">P</div>
            <div>
                <h2 id="display-name" class="font-bold text-slate-800 text-sm">คุณเปรมวดี</h2>
                <span class="text-[10px] text-green-500 font-bold uppercase">Live Session</span>
            </div>
        </div>
        <div class="flex flex-col gap-1 items-end">
            <select id="level-select" class="bg-slate-50 border border-slate-200 rounded-md px-1 py-1 text-[10px] outline-none">
                <option value="1">Level 1: คุณเปรมวดี (ใจดี)</option>
                <option value="2">Level 2: คุณสมเกียรติ (เน้นเหตุผล)</option>
                <option value="3">Level 3: คุณฤทัย (สายเหวี่ยง)</option>
                <option value="4">Level 4: คุณฐิติกร (บิ๊กบอส)</option>
            </select>
            <button id="end-call-btn" class="bg-red-500 text-white px-3 py-1 rounded text-[10px] font-bold uppercase">จบการสนทนา</button>
        </div>
    </header>

    <main id="chat-window" class="chat-area overflow-y-auto p-4 flex flex-col gap-4"></main>

    <footer class="p-6 bg-white border-t flex flex-col items-center gap-2 shadow-inner">
        <button id="mic-btn" class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-xl transition-all active:scale-90">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
        </button>
        <p id="instruction" class="text-slate-400 text-xs">แตะไมค์แล้วเริ่มพูด</p>
        <div id="user-transcript" class="text-blue-500 text-[10px] italic h-4 overflow-hidden text-center"></div>
    </footer>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const micBtn = document.getElementById('mic-btn');
        const instruction = document.getElementById('instruction');
        const userTranscript = document.getElementById('user-transcript');
        const levelSelect = document.getElementById('level-select');
        const displayName = document.getElementById('display-name');
        const avatar = document.getElementById('avatar');
        
        // ข้อมูล UI ของแต่ละตัวละคร
        const charData = {
            "1": { name: "คุณเปรมวดี", initial: "P", color: "bg-blue-600" },
            "2": { name: "คุณสมเกียรติ", initial: "S", color: "bg-slate-700" },
            "3": { name: "คุณฤทัย", initial: "R", color: "bg-pink-600" },
            "4": { name: "คุณฐิติกร", initial: "T", color: "bg-amber-600" }
        };

        let history = [];
        let isProcessing = false;
        const audioPlayer = new Audio();

        // ฟังก์ชันเปลี่ยนชื่อลูกค้าบนหน้าจอ
        function updateCustomerUI(level) {
            const char = charData[level] || charData["1"];
            displayName.innerText = char.name;
            avatar.innerText = char.initial;
            avatar.className = `w-10 h-10 rounded-full flex items-center justify-center text-white font-bold transition-all ${char.color}`;
        }

        // เมื่อเปลี่ยน Level
        levelSelect.addEventListener('change', (e) => {
            updateCustomerUI(e.target.value);
            history = []; // ล้างประวัติเพื่อเริ่มคุยกับคนใหม่
            chatWindow.innerHTML = '';
            appendMessage('bot', `ระบบเชื่อมต่อสายกับ ${charData[e.target.value].name} แล้วค่ะ...`);
        });

        // Speech Recognition (ส่วนเดิมของคุณ)
        // ... (ใส่ Logic webkitSpeechRecognition ของเดิมที่นี่)

        document.getElementById('start-btn').addEventListener('click', () => {
            updateCustomerUI(levelSelect.value);
            welcomeScreen.classList.add('hidden');
            appendMessage('bot', `ฮัลโหลค่ะ... สวัสดีค่ะ? (${charData[levelSelect.value].name} พูดสายค่ะ)`);
        });

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `max-w-[85%] p-3 rounded-2xl text-sm ${role === 'user' ? 'bg-blue-600 text-white self-end rounded-tr-none shadow-md' : 'bg-white text-slate-800 self-start border border-slate-100 rounded-tl-none shadow-sm'}`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
        }

        async function sendToAI(message) {
            appendMessage('user', message);
            userTranscript.innerText = "";
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, history, level: levelSelect.value })
                });
                const data = await res.json();
                
                // อัปเดตชื่อจาก API เพื่อความชัวร์
                if (data.customerName) displayName.innerText = data.customerName;

                appendMessage('bot', data.text);
                history.push({ role: "user", parts: [{ text: message }] });
                history.push({ role: "model", parts: [{ text: data.text }] });

                if (data.audio) {
                    audioPlayer.src = `data:audio/mp3;base64,${data.audio}`;
                    audioPlayer.play();
                }
            } catch (e) { alert("เกิดข้อผิดพลาดในการเชื่อมต่อ"); }
            finally { isProcessing = false; }
        }

        // (ปุ่ม End Call และส่วนประเมินผล เหมือนเดิมของคุณ)
    </script>
</body>
    </script>
</body>
</html>
