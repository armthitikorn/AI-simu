<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Telesales Exam Simulator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .mic-active { animation: pulse 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .chat-area { height: calc(100vh - 240px); }
        .eval-scroll { max-height: 40vh; overflow-y: auto; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <div id="welcome-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 text-white p-6 text-center">
        <div>
            <h1 class="text-4xl font-bold mb-4 text-blue-400">Exam Simulator</h1>
            <p class="mb-10 text-slate-400">ระบบประเมินผลมาตรฐาน 17 ข้อ สำหรับพนักงานขาย</p>
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-14 py-5 rounded-full text-2xl font-bold shadow-2xl transition-all active:scale-95">
                เริ่มเข้าห้องสอบ
            </button>
        </div>
    </div>

    <header class="p-4 bg-white border-b flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <div id="avatar" class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white text-xl font-bold shadow-inner">P</div>
            <div>
                <h2 id="display-name" class="font-bold text-slate-800 text-lg leading-tight">คุณเปรมวดี</h2>
                <span id="status-tag" class="text-[10px] text-green-500 font-bold uppercase tracking-widest">Active Session</span>
            </div>
        </div>
        <div class="flex flex-col gap-1 items-end">
            <select id="level-select" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs outline-none focus:ring-1 focus:ring-blue-400">
                <option value="1">Level 1: คุณเปรมวดี (ใจดี)</option>
                <option value="2">Level 2: คุณสมเกียรติ (เน้นเหตุผล)</option>
                <option value="3">Level 3: คุณฤทัย (สายเหวี่ยง)</option>
                <option value="4">Level 4: คุณฐิติกร (บิ๊กบอส)</option>
            </select>
            <button id="end-call-btn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-1 rounded-md text-[10px] font-bold uppercase transition-all shadow-md">ส่งผลการประเมิน</button>
        </div>
    </header>

    <main id="chat-window" class="chat-area overflow-y-auto p-6 flex flex-col gap-4"></main>

    <footer class="p-6 bg-white border-t flex flex-col items-center justify-center gap-2 shadow-inner">
        <button id="mic-btn" class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-xl transition-all active:scale-90 touch-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        </button>
        <p id="instruction" class="text-slate-400 text-xs">แตะไมค์แล้วเริ่มพูด</p>
        <div id="user-transcript" class="text-blue-500 text-[10px] italic h-4 overflow-hidden"></div>
    </footer>

    <div id="eval-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-slate-900/95 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-lg overflow-hidden shadow-2xl">
            <div id="result-header" class="p-6 text-center text-white bg-blue-600">
                <h3 class="text-2xl font-bold">ผลการทดสอบ (Exam Result)</h3>
                <p id="pass-fail-text" class="text-sm font-bold mt-1 bg-white/20 px-4 py-1 rounded-full inline-block"></p>
            </div>
            <div class="p-6 space-y-4">
                <div class="flex justify-center">
                    <div class="w-24 h-24 rounded-full border-4 border-slate-100 flex flex-col items-center justify-center bg-blue-50">
                        <span id="score-val" class="text-3xl font-black text-blue-600">0</span>
                        <p class="text-[8px] text-blue-400 font-bold uppercase tracking-widest">Score / 85</p>
                    </div>
                </div>
                <div id="eval-details" class="eval-scroll space-y-3"></div>
            </div>
            <div class="p-4 bg-slate-50 flex justify-center border-t">
                <button onclick="location.reload()" class="bg-slate-900 text-white px-10 py-3 rounded-full font-bold shadow-lg">ฝึกใหม่อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const micBtn = document.getElementById('mic-btn');
        const instruction = document.getElementById('instruction');
        const userTranscript = document.getElementById('user-transcript');
        const levelSelect = document.getElementById('level-select');
        const endCallBtn = document.getElementById('end-call-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        let history = [];
        let recognition;

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.interimResults = true;

            recognition.onstart = () => { micBtn.classList.add('mic-active'); instruction.innerText = "กำลังฟังคุณ..."; };
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                userTranscript.innerText = `พูดว่า: ${text}`;
                if (event.results[0].isFinal) sendToAI(text);
            };
            recognition.onend = () => { micBtn.classList.remove('mic-active'); instruction.innerText = "แตะไมค์เพื่อพูดต่อ"; };
        }

        // Start Button Click
        document.getElementById('start-btn').addEventListener('click', () => {
            welcomeScreen.classList.add('hidden');
            // Play a short silent sound to unlock audio context on mobile
            new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==').play().catch(() => {});
            appendMessage('bot', 'ฮัลโหลค่ะ... สวัสดีค่ะ ไม่ทราบว่าโทรจากที่ไหนคะ?');
        });

        micBtn.addEventListener('click', () => { 
            if(recognition) {
                try { recognition.start(); } catch(e) { console.log("Recognition already started"); }
            } else {
                alert("เบราว์เซอร์ของคุณไม่รองรับการสั่งงานด้วยเสียง");
            }
        });

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `max-w-[85%] p-4 rounded-2xl text-sm ${role === 'user' ? 'bg-blue-600 text-white self-end rounded-tr-none shadow-md' : 'bg-white text-slate-800 self-start border border-slate-100 rounded-tl-none shadow-sm'}`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
        }

        async function sendToAI(message) {
            appendMessage('user', message);
            userTranscript.innerText = "";
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, history, level: levelSelect.value })
                });
                const data = await res.json();
                
                appendMessage('bot', data.text);
                history.push({ role: "user", parts: [{ text: message }] });
                history.push({ role: "model", parts: [{ text: data.text }] });

                if (data.audio) {
                    const audio = new Audio(`data:audio/mp3;base64,${data.audio}`);
                    audio.play();
                }
            } catch (e) { 
                console.error(e);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อกับ AI"); 
            }
        }

        endCallBtn.addEventListener('click', async () => {
            if (history.length === 0) return alert("ยังไม่ได้เริ่มการสนทนาค่ะ");
            endCallBtn.disabled = true;
            endCallBtn.innerText = "กำลังประเมินผล...";
            
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history, isEnding: true })
                });
                const data = await res.json();
                showEvaluation(data.evaluation);
            } catch (e) { 
                alert("ระบบประเมินผลขัดข้อง"); 
                endCallBtn.disabled = false;
                endCallBtn.innerText = "ส่งผลการประเมิน";
            }
        });

        function showEvaluation(evalData) {
            const score = evalData.score;
            const isPass = score >= 50;

            document.getElementById('eval-modal').classList.remove('hidden');
            document.getElementById('result-header').className = `p-6 text-center text-white ${isPass ? 'bg-green-600' : 'bg-red-600'}`;
            document.getElementById('pass-fail-text').innerText = isPass ? 'ผ่านเกณฑ์ (PASS)' : 'ไม่ผ่านเกณฑ์ (FAIL)';
            document.getElementById('score-val').innerText = score;

            let breakdownHTML = `<div class="bg-slate-50 p-4 rounded-xl text-[11px] border space-y-1">`;
            evalData.detail_breakdown.forEach(item => {
                breakdownHTML += `<div class="flex justify-between border-b pb-1"><span>${item.topic}</span><span class="font-bold text-blue-600">${item.stars} ⭐</span></div>`;
            });
            breakdownHTML += `</div>`;
            
            document.getElementById('eval-details').innerHTML = `
                ${breakdownHTML}
                <div class="p-3 bg-green-50 rounded-lg border-l-4 border-green-500 text-xs"><p class="font-bold text-green-700">จุดแข็ง:</p><p>${evalData.strengths}</p></div>
                <div class="p-3 bg-red-50 rounded-lg border-l-4 border-red-500 text-xs"><p class="font-bold text-red-700">จุดที่ควรปรับปรุง:</p><p>${evalData.weaknesses}</p></div>
            `;
        }
    </script>
</body>
</html>
