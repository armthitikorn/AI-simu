<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Telesales Simulator PRO (iOS Ready)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .mic-active { animation: pulse 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .chat-area { height: calc(100vh - 280px); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <div id="welcome-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 text-white p-6 text-center">
        <div class="max-w-sm">
            <h1 class="text-4xl font-bold mb-4 text-blue-400">Telesales Exam</h1>
            <p class="mb-8 text-slate-400">ระบบฝึกฝนเสมือนจริงสำหรับ iPhone<br>กรุณาเปิดเสียงก่อนเริ่ม</p>
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-500 text-white w-full py-5 rounded-full text-2xl font-bold shadow-2xl active:scale-95 transition-all">
                เข้าสู่โหมดจำลอง
            </button>
        </div>
    </div>

    <header class="p-4 bg-white border-b flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div id="avatar" class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold">P</div>
            <div>
                <h2 id="display-name" class="font-bold text-slate-800 text-sm">คุณเปรมวดี</h2>
                <div class="flex items-center gap-1"><span class="w-2 h-2 bg-green-500 rounded-full"></span><span class="text-[10px] text-slate-400 uppercase">Live Chat</span></div>
            </div>
        </div>
        <div class="flex flex-col gap-1 items-end">
            <select id="level-select" class="bg-slate-50 border border-slate-200 rounded-md px-1 py-1 text-[10px] outline-none">
                <option value="1">Lv 1: ใจดี (คุณเปรมวดี)</option>
                <option value="2">Lv 2: เน้นเหตุผล (คุณสมเกียรติ)</option>
                <option value="3">Lv 3: ใจร้อน (คุณฤทัย)</option>
                <option value="4">Lv 4: บิ๊กบอส (คุณฐิติกร)</option>
            </select>
            <button id="end-call-btn" class="bg-red-500 text-white px-3 py-1 rounded text-[10px] font-bold">ส่งผลการประเมิน</button>
        </div>
    </header>

    <main id="chat-window" class="chat-area overflow-y-auto p-4 flex flex-col gap-4"></main>

    <footer class="p-6 bg-white border-t flex flex-col items-center gap-2">
        <button id="mic-btn" class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-xl active:scale-90 transition-all touch-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        </button>
        <p id="instruction" class="text-slate-400 text-xs">แตะเพื่อพูด</p>
        <div id="user-transcript" class="text-blue-500 text-[10px] italic h-4 text-center"></div>
    </footer>

    <div id="eval-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-slate-900/95 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-md overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div id="result-header" class="p-6 text-center text-white bg-blue-600">
                <h3 class="text-2xl font-bold">สรุปผลการทดสอบ</h3>
                <p id="pass-fail-text" class="text-xs font-bold mt-1 uppercase"></p>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-4">
                <div class="flex justify-center">
                    <div class="w-24 h-24 rounded-full border-4 border-slate-100 flex flex-col items-center justify-center bg-blue-50">
                        <span id="score-val" class="text-3xl font-black text-blue-600">0</span>
                        <p class="text-[8px] text-blue-400 font-bold uppercase">Points / 85</p>
                    </div>
                </div>
                <div id="eval-details" class="text-xs space-y-3"></div>
            </div>
            <div class="p-4 bg-slate-50 border-t flex justify-center">
                <button onclick="location.reload()" class="bg-slate-900 text-white px-10 py-3 rounded-full font-bold shadow-lg">ฝึกใหม่อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const micBtn = document.getElementById('mic-btn');
        const instruction = document.getElementById('instruction');
        const userTranscript = document.getElementById('user-transcript');
        const levelSelect = document.getElementById('level-select');
        const endCallBtn = document.getElementById('end-call-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        let history = [];
        let recognition;
        let isProcessing = false;

        // --- iPhone Audio Context Unlock ---
        const audioObj = new Audio(); 
        function unlockAudio() {
            audioObj.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
            audioObj.play().catch(e => console.log("Audio unlock interaction needed"));
        }

        // --- Speech Recognition (Safari Supported) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.interimResults = true;

            recognition.onstart = () => { micBtn.classList.add('mic-active'); instruction.innerText = "กำลังฟัง..."; };
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                userTranscript.innerText = text;
                if (event.results[0].isFinal && !isProcessing) {
                    isProcessing = true;
                    sendToAI(text);
                }
            };
            recognition.onend = () => { micBtn.classList.remove('mic-active'); instruction.innerText = "แตะเพื่อพูดต่อ"; isProcessing = false; };
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            unlockAudio();
            welcomeScreen.classList.add('hidden');
            appendMessage('bot', 'ฮัลโหล... สวัสดีค่ะ/ครับ?');
        });

        micBtn.addEventListener('click', () => { 
            if(recognition) try { recognition.start(); } catch(e) {}
        });

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `max-w-[85%] p-3 rounded-2xl text-sm ${role === 'user' ? 'bg-blue-600 text-white self-end rounded-tr-none' : 'bg-white text-slate-800 self-start border border-slate-100 rounded-tl-none shadow-sm'}`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
        }

        async function sendToAI(message) {
            appendMessage('user', message);
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, history, level: levelSelect.value })
                });
                const data = await res.json();
                
                appendMessage('bot', data.text);
                history.push({ role: "user", parts: [{ text: message }] });
                history.push({ role: "model", parts: [{ text: data.text }] });

                if (data.audio) {
                    audioObj.src = `data:audio/mp3;base64,${data.audio}`;
                    audioObj.play();
                }

                if (data.forceDisconnect) {
                    setTimeout(() => { alert("สายหลุด: " + data.text); location.reload(); }, 3000);
                }
            } catch (e) { alert("การเชื่อมต่อขัดข้อง"); }
        }

        endCallBtn.addEventListener('click', async () => {
            if (history.length < 2) return alert("กรุณาเริ่มการสนทนาก่อน");
            endCallBtn.innerText = "กำลังประเมิน...";
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history, isEnding: true })
                });
                const data = await res.json();
                const evalData = data.evaluation;
                
                document.getElementById('eval-modal').classList.remove('hidden');
                document.getElementById('score-val').innerText = evalData.score;
                document.getElementById('pass-fail-text').innerText = evalData.score >= 50 ? "PASS (ผ่านเกณฑ์)" : "FAIL (ควรฝึกฝนเพิ่ม)";
                
                let detailHTML = `<div class="bg-slate-50 p-3 rounded-lg border space-y-1">`;
                evalData.detail_breakdown.forEach(item => {
                    detailHTML += `<div class="flex justify-between border-b pb-1"><span>${item.topic}</span><span class="font-bold text-blue-600">${item.stars} ⭐</span></div>`;
                });
                detailHTML += `</div>`;
                
                document.getElementById('eval-details').innerHTML = `
                    ${detailHTML}
                    <div class="p-2 bg-green-50 rounded border-l-4 border-green-500 font-bold text-green-700">จุดแข็ง: ${evalData.strengths}</div>
                    <div class="p-2 bg-red-50 rounded border-l-4 border-red-500 font-bold text-red-700">จุดที่ควรปรับ: ${evalData.weaknesses}</div>
                `;
            } catch (e) { alert("ประเมินผลผิดพลาด"); }
        });
    </script>
</body>
</html>
